name: Build verse data

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/**"
      - ".github/workflows/build-data.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python tools/build_data.py
      - name: Copy OpenCV.js (Apache-2.0) so the inscription reader is served from this site
        run: |
          mkdir -p docs/vendor
          if npm pack @techstark/opencv-js --silent >/dev/null 2>&1; then
            tar -xzf techstark-opencv-js-*.tgz
            cp package/dist/opencv.js docs/vendor/opencv.js
            cp package/LICENSE docs/vendor/OPENCV_LICENSE.txt 2>/dev/null || curl -fsSL https://raw.githubusercontent.com/opencv/opencv/4.x/LICENSE -o docs/vendor/OPENCV_LICENSE.txt
            rm -rf package techstark-opencv-js-*.tgz
          else
            curl -fsSL https://docs.opencv.org/4.10.0/opencv.js -o docs/vendor/opencv.js
            curl -fsSL https://raw.githubusercontent.com/opencv/opencv/4.x/LICENSE -o docs/vendor/OPENCV_LICENSE.txt
          fi
          test -s docs/vendor/opencv.js
          ls -l docs/vendor
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/texts.json docs/vendor
          git commit -m "Build verse data" || echo "No changes"
          git pull --rebase
          git push
